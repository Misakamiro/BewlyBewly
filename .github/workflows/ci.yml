name: CI

on:
  push:
    branches:
      # The branch where the project source code resides
      # 项目源代码所在的分支
      - dev
      - main
    paths-ignore:
      # Changes involving the following path files will not trigger the workflow
      # 涉及以下路径文件的更改不会触发工作流
      - LICENSE
      - README-cmn_CN.md
      - README-cmn_TW.md
      - README-jyut.md
      - docs/**

  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - LICENSE
      - README-cmn_CN.md
      - README-cmn_TW.md
      - README-jyut.md
      - docs/**

jobs:
  test:
    name: Test
    strategy:
      matrix:
        node: [lts/*, lts/-1]
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - args: [--frozen-lockfile]

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run lint

      - name: Type check
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Knip
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run knip

      # 生产依赖漏洞门禁(此前完全没有,导致 2026-09 记录的"0 漏洞"悄悄退化).
      # --audit-level=critical 是刻意选择:当前有且仅有 1 个已接受的 high ——
      # @vue/server-renderer <3.5.42 (GHSA-g2v6-rqmx-r4w6). 它只是 vue 的传递依赖(SSR 包),
      # 本扩展不做服务端渲染,已确认其入口(renderToString / ssrRenderAttrs 等)不在任何
      # 构建产物中,也没有任何源码 import 它;修掉它必须把 vue 升到 3.5.x,代价是重跑全量
      # 真实浏览器验证. 升级 Vue 到 >=3.5.42 后,把这里收紧为 --audit-level=high.
      - name: Audit production dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm audit --prod --audit-level=critical

      - name: Build Extension
        run: pnpm build

      - name: Upload Zip
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 'lts/*' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name: BewlyBewly Zip
          path: extension

      - name: Build Extension-Firefox
        run: pnpm build-firefox

      - name: Upload Zip
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 'lts/*' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name: BewlyBewly-Firefox Zip
          path: extension-firefox
