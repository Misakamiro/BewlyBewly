name: 问题报告
description: 遇到错误请在此报告。
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        ## 问题报告
        提交前请先搜索本仓库已有的 issue(含已关闭的),重复问题会被关闭。

        标题请写清问题本身;类似“bug”“错误”“有问题”这类标题会被直接关闭。

        功能请求不要用问题报告模板,另开一个 issue 说明即可。

        若遇到页面相关问题(比如某页面下出现了不该出现的元素),请一并附上发生问题的页面链接。

        ### 安装渠道
        本仓库是个人维护分支,请从本仓库 Release 下载 `extension.zip` 解压后以“加载解压缩的扩展”方式安装(见 README),或按 README 自行构建。

        本分支未上架任何浏览器扩展商店;从商店安装的同名扩展与本分支版本不一致,相关问题请向对应渠道反馈。

        Firefox 可自行构建;本分支不发布 Safari 版本。

  - type: textarea
    attributes:
      label: 环境信息
      description: 【请勿修改 issue 模版。】扩展版本、浏览器版本、以及你做出的自定义设置。
      placeholder: |
        - 浏览器（如 Microsoft Edge）：
        - 浏览器版本（如 153.0.4234.48）：
        - BewlyBewly 版本（如 0.41.14）：
        - 扩展来源（本仓库 Release 的 zip / 自行构建）：

        如果你修改了 BewlyBewly 的设置,请写在下面以方便我们排查问题(可粗略写成类似“设置了××后出现这个问题”〔将“××”替换为你的设置项〕)：

      value: |
        - 浏览器（如 Microsoft Edge）：
        - 浏览器版本（如 153.0.4234.48）：
        - BewlyBewly 版本（如 0.41.14）：
        - 扩展来源（本仓库 Release 的 zip / 自行构建）：

        如果你修改了 BewlyBewly 的设置,请写在下面以方便我们排查问题(可粗略写成类似“设置了××后出现这个问题”〔将“××”替换为你的设置项〕)：

    validations:
      required: true

  - type: textarea
    attributes:
      label: 问题描述
      description: 如何重现,最好带有截图或视频以便排查。
      placeholder: |
        请预先搜索此问题是否在其他 issue 中出现过,重复的 issue 会被关闭。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期行为
      description: 你认为应该是什么行为。
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: 最终确认
      description: 请确认以下所有内容,否则将被关闭。
      options:
        - label: 我确认在停用 BewlyBewly 并强制刷新(按住 Shift 键的同时按刷新键)后,问题不再出现。
          required: false
        - label: 我确认此问题未在其他 issue 中出现过。
          required: false
        - label: 我确认我已搜索过本仓库已有的 issue,其中没有对应我问题的解决方案。
          required: false
        - label: 我确认我正在使用本仓库 Release 的最新 BewlyBewly 版本。
          required: false

  - type: checkboxes
    attributes:
      label: 作出贡献?
      description: 【此选项非必选,如果你不晓得这里在说什么,请勿勾选。】我们欢迎任何人贡献代码,见 [CONTRIBUTING.md](https://github.com/Misakamiro/BewlyBewly/blob/main/docs/CONTRIBUTING.md)。
      options:
        - label: 我将自行提交一个 PR 来解决此问题。
          required: false
